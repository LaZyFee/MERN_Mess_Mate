name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  server:
    name: Server (syntax · import smoke · routes · tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Server/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # 1) Syntax check every JS file (catches the "module cannot parse" class of
      #    bug that pure rule tests never touch).
      - name: node --check (all files)
        run: |
          find . -path ./node_modules -prune -o -name '*.js' -print0 \
            | xargs -0 -n1 node --check

      # 2) Module-import smoke: every route/controller/service/model must load.
      - name: Module import smoke
        run: node scripts/importSmoke.mjs

      # 3) Route ↔ API doc diff, including generated-table freshness.
      - name: Route / doc audit
        run: |
          node scripts/auditRoutes.mjs
          node scripts/auditRoutes.mjs --write-table --check

      # 4) Unit suite.
      - name: Unit tests
        run: npm test

      # 5) Integration suite (mongodb-memory-server starts its own replica set
      #    when the code needs transactions; no external Mongo required).
      - name: Integration tests
        run: npm run test:integration
        env:
          NODE_ENV: test
          JWT_SECRET: ci-test-secret
          ENABLE_SCHEDULER: "false"
